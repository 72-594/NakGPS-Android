name: Crear APK de NakGPS
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NakGPS-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: |
          pip install pillow
          python3 tools/prepare_android.py
      - run: npx cap sync android
      - working-directory: NakGPS-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NakGPS-apk
          path: NakGPS-android/android/app/build/outputs/apk/debug/app-debug.apk
